        - 'Expectation of a Function of a Random Variable': 'probability-theory/random-variables/expectation-of-a-function-of-a-random-variable.md'
        - 'Bernoulli and Binomial Variables': 'probability-theory/random-variables/bernoulli-and-binomial-variables.md'
        - 'Poisson Distribution': 'probability-theory/random-variables/poisson-distribution.md'
        - 'Geometric Distribution': 'probability-theory/random-variables/geometric-distribution.md'
      - 'Continuous Random Variables':
        - 'Preface': 'probability-theory/continuous-random-variables/preface.md'
        - 'Normal Distribution': 'probability-theory/continuous-random-variables/normal-distribution.md'
        - 'Exponential Distribution': 'probability-theory/continuous-random-variables/exponential-distribution.md'
        - 'Connection Between Exponential and Poisson Distributions': 'probability-theory/continuous-random-variables/connection-between-exponential-and-poisson-distributions.md'
